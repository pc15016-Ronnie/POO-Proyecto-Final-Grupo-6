spring:
  application:
    name: eventos-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventosdb}
    username: ${DB_USER:eventos}
    password: ${DB_PASSWORD:eventos123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    org.hibernate.SQL: info
    com.ues.poo.eventos: info
